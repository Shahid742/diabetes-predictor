<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Predictor</title>
    {% load static %}
    <!-- <link rel="stylesheet" href="{% static 'predictor/css/form.css' %}"> -->
    <style>
        body {
            background-color: #b1d6f7;
        }
        .predictor-form {
            background-color: #ffffff;
            border: 2px solid #007bff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
            margin: auto;
            margin-top: 50px;
        }
        .predictor-form h1 {
            margin-bottom: 20px;
        }
        .predictor-form label {
            font-weight: bold;
        }
        .predictor-form input, .predictor-form select {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            margin-left: 10px;
        }
        .predictor-form button {
            width: auto;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            display: block;
            margin: 0 auto;
        }
        .predictor-form button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="predictor-form">
    <h1>Diabetes Prediction Form</h1>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="" disabled selected>Select your gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="120" required placeholder="Enter Your Age">

        <label for="hypertension">Hypertension :</label>
        <select id="hypertension" name="hypertension" required>
            <option value="" disabled selected>Select an option</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label for="heart_disease">Heart Disease :</label>
        <select id="heart_disease" name="heart_disease" required>
            <option value="" disabled selected>Select an option</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label for="bmi">BMI:</label>
        <input type="number" step="0.01" id="bmi" name="bmi" required min="12" max="80" placeholder="Enter Your Body Mass Index">

        <label for="HbA1c_level">HbA1c Level:</label>
        <input type="number" step="0.01" id="HbA1c_level" name="HbA1c_level" required min="4" max="16" placeholder="Enter Your HbA1c_level">

        <label for="blood_glucose_level">Blood Glucose Level:</label>
        <input type="number" step="0.01" id="blood_glucose_level" name="blood_glucose_level" required min="54" max="600" placeholder="Enter Your Glucose Level">

        <button type="submit" >Click To Predict</button>

        

    </form>
</div>
</body>
</html>
