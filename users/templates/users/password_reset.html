{% extends "users/base.html" %}
{% block title %} Password Reset {% endblock title %}
{% block content %}
    <div class="container mt-5 d-flex justify-content-center align-items-center" style="height: 70vh;">
        <div class="card shadow-sm" style="width: 30rem; border-radius: 20px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
            <div class="card-body">
                <h2 class="text-center" style="color: #0e0d0d;">Password Reset</h2>
                <p class="text-center" style="color: #0e0d0d;">Please enter your email address to receive a link to reset your password.</p>
                <form method="POST" class="password-reset-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-block">Submit</button>
                </form>
            </div>
        </div>
    </div>
    
<style>
    .password-reset-form {
    margin-top: 20px;
    color: #0e0d0d;
}

.password-reset-form label {
    display: block;
    margin-bottom: 10px;
    color: #0e0d0d;
}

.password-reset-form input[type="email"] {
    width: 100%;
    height: 40px;
    margin-bottom: 20px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.password-reset-form button[type="submit"] {
    width: 100%;
    height: 40px;
    background-color:#3498db;
    color: #fff;
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.password-reset-form button[type="submit"]:hover {
    background-color:#2980b9;
}
</style>

{% endblock content %}
